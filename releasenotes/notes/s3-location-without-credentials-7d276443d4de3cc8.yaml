---
features:
  - |
    S3 location URIs are now credential-free, containing only the scheme,
    host, bucket, and object key. Credentials are resolved at runtime from
    configured backend options (``s3_store_access_key`` /
    ``s3_store_secret_key``) instead of being embedded in the URI.
    Existing images with legacy credential-bearing S3 URIs are migrated
    automatically on first access. No bulk migration or downtime is
    required. Admins must update Glance as well — ``glance_store``
    writes the new format, ``glance`` handles lazy migration of
    existing URIs.
